version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: auth-jwt-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-auth_jwt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      # Verifica database específico (mais robusto)
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-auth_jwt}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - auth-jwt-network-dev

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-jwt-app-dev
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-auth_jwt}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-minimum-32-characters-long}
      PASSWORD_SALT_ROUNDS: ${PASSWORD_SALT_ROUNDS:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auth-jwt-network-dev
    # Volumes para desenvolvimento com hot reload
    volumes:
      - .:/app
      - /app/node_modules
      - /app/build
    # Comando para desenvolvimento: instala, gera Prisma, migra e roda
    command: >
      sh -c "
        pnpm install --frozen-lockfile &&
        pnpm prisma generate &&
        pnpm prisma migrate dev --name init &&
        pnpm start:dev
      "

volumes:
  postgres_data_dev:
    driver: local

networks:
  auth-jwt-network-dev:
    driver: bridge
